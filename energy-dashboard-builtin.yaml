# Energy Dashboard (Pure Built-in Cards - No Custom Cards Required)
# Paste this into Home Assistant UI Dashboard Editor, or add to your lovelace config

title: Energy
path: energy
icon: mdi:flash
badges: []
cards:
  # Current Status - Real-time
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.envoy_202210044703_current_power_production
        min: 0
        max: 10
        needle: true
        unit: kW
        name: Solar Production
        severity:
          green: 2
          yellow: 0.5
          red: 0
      - type: gauge
        entity: sensor.envoy_202210044703_current_power_consumption
        min: 0
        max: 10
        needle: true
        unit: kW
        name: Home Consumption
        severity:
          green: 0
          yellow: 3
          red: 6

  # Battery State
  - type: gauge
    entity: sensor.envoy_202210044703_battery
    min: 0
    max: 100
    needle: true
    unit: '%'
    name: Battery Level
    severity:
      green: 50
      yellow: 25
      red: 10

  # Today's Energy
  - type: horizontal-stack
    cards:
      - type: stat
        entity: sensor.envoy_202210044703_energy_production_today
        name: Today's Production
        icon: mdi:solar-power-box
      - type: stat
        entity: sensor.envoy_202210044703_energy_consumption_today
        name: Today's Consumption
        icon: mdi:lightning-bolt
      - type: stat
        entity: sensor.envoy_202210044703_current_net_power_consumption
        name: Net Power (Now)
        icon: mdi:flash-outline

  # Weekly Comparison
  - type: horizontal-stack
    cards:
      - type: stat
        entity: sensor.envoy_202210044703_energy_production_last_seven_days
        name: 7-Day Production
        icon: mdi:chart-line
      - type: stat
        entity: sensor.envoy_202210044703_energy_consumption_last_seven_days
        name: 7-Day Consumption
        icon: mdi:chart-line

  # Lifetime Stats
  - type: horizontal-stack
    cards:
      - type: stat
        entity: sensor.envoy_202210044703_lifetime_energy_production
        name: Lifetime Production
        icon: mdi:solar-power
      - type: stat
        entity: sensor.envoy_202210044703_lifetime_energy_consumption
        name: Lifetime Consumption
        icon: mdi:home-lightning-bolt
      - type: stat
        entity: sensor.envoy_202210044703_lifetime_net_energy_production
        name: Net Exported
        icon: mdi:transmission-tower

  # 24-Hour History Graph
  - type: history-graph
    title: Production vs Consumption (Last 24 Hours)
    entities:
      - entity: sensor.envoy_202210044703_current_power_production
        name: Solar Production
      - entity: sensor.envoy_202210044703_current_power_consumption
        name: Consumption
    hours_to_show: 24
    refresh_interval: 0

  # Info & Legend
  - type: markdown
    content: |
      ## Energy Monitoring
      
      **Your Solar System:** Enphase Envoy with Encharge Battery Storage
      
      ### Current Readings
      - **Solar Production:** Real-time power being generated by your panels (kW)
      - **Home Consumption:** Real-time power being used by your home (kW)
      - **Net Power:** Difference between production and consumption (positive = excess to grid)
      - **Battery Level:** Current state of charge of your battery bank (%)
      
      ### Daily & Weekly
      - **Today's Production/Consumption:** kWh generated and used in the current day
      - **7-Day Trends:** Rolling 7-day averages to spot patterns
      
      ### Lifetime
      - **Total Production:** All energy generated since system install (MWh)
      - **Total Consumption:** All energy used since install (MWh)
      - **Net Exported:** Excess energy sent to grid (MWh) — you may get credits for this!
      
      ---
      Last updated: Real-time, refreshes every 30 seconds
